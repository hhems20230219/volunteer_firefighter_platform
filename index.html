<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>首頁｜義消隊務管理平台</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/css/all.min.css" rel="stylesheet">
    <link href="css/common.css" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
</head>
<body data-page="index">
    <div id="navbarHost"></div>

    <main class="py-4 py-lg-5">
        <div class="container">
            <header class="hero-panel rounded-4 shadow-sm p-4 p-lg-5 mb-4">
                <p class="text-danger fw-bold mb-2">
                    <i class="fa-solid fa-building-shield me-2"></i>
                    第一救護大隊｜新興分隊
                </p>
                <h1 class="display-6 fw-bold mb-3">義消隊務管理平台</h1>

                    整合出勤登錄、個人履歷查詢與隊務統計。
                </p>
            </header>

            <section class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 p-4 pb-0">
                    <div class="d-flex flex-column flex-sm-row justify-content-between gap-2">
                        <h2 class="h4 fw-bold mb-0">
                            <i class="fa-solid fa-bullhorn text-danger me-2"></i>
                            公告欄
                        </h2>
                    </div>
                </div>
                <div class="card-body p-4">
                    <div id="announcementList"></div>
                </div>
            </section>
        </div>
    </main>

    <div id="footerHost"></div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/data-service.js"></script>
    <script src="js/index.js"></script>
