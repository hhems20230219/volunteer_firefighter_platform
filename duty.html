<!DOCTYPE html>
<html lang="zh-Hant">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   出勤紀錄｜義消隊務管理平台
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.datatables.net/2.3.8/css/dataTables.bootstrap5.min.css" rel="stylesheet"/>
  <link href="https://cdn.datatables.net/responsive/3.0.8/css/responsive.bootstrap5.min.css" rel="stylesheet"/>
  <link href="css/common.css" rel="stylesheet"/>
  <link href="css/duty.css" rel="stylesheet"/>
 </head>
 <body data-page="duty">
  <div id="navbarHost">
  </div>
  <main class="py-4 py-lg-5">
   <div class="container">
    <header class="page-header ps-3 mb-4 d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
     <div>
      <h1 class="h2 fw-bold mb-2">出勤紀錄</h1>
      <p class="text-secondary mb-0">所有勤務皆為目前個人紀錄，透過按鈕流程辦理。</p>
     </div>
     <div class="duty-clock text-lg-end" aria-live="polite">
      <div class="duty-clock-time" id="currentClockTime">00:00:00</div>
      <div class="duty-clock-date" id="currentClockDate">0000-00-00</div>
     </div>
    </header>
    <section class="card border-0 shadow-sm mb-4">
     <div class="card-body p-4">
      <h2 class="h4 fw-bold mb-4">
       選擇勤務類型
      </h2>
      <div class="row g-3">
       <div class="col-12 col-md-4">
        <button class="btn duty-type-btn w-100" data-type="協勤">
         <i class="fa-solid fa-truck-medical">
         </i>
         <span>
          協勤
         </span>
        </button>
       </div>
       <div class="col-12 col-md-4">
        <button class="btn duty-type-btn w-100" data-type="常年訓練">
         <i class="fa-solid fa-person-chalkboard">
         </i>
         <span>
          常年訓練
         </span>
        </button>
       </div>
       <div class="col-12 col-md-4">
        <button class="btn duty-type-btn w-100" data-type="公差勤務">
         <i class="fa-solid fa-briefcase">
         </i>
         <span>
          公差勤務
         </span>
        </button>
       </div>
      </div>
     </div>
    </section>
    <section class="card border-0 shadow-sm mb-4 d-none" id="pendingDutySection">
     <div class="card-body p-4">
      <h2 class="h4 fw-bold mb-3">
       進行中勤務
      </h2>
      <div id="pendingDutyContent"></div>
     </div>
    </section>
    <section class="card border-0 shadow-sm">
     <div class="card-body p-4">
      <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end gap-3 mb-3">
       <h2 class="h4 fw-bold mb-0">我的勤務紀錄</h2>
       <div class="row g-2 duty-filter-row">
        <div class="col-6">
         <label class="form-label small fw-semibold mb-1" for="dutyYearFilter">年度</label>
         <select class="form-select" id="dutyYearFilter"></select>
        </div>
        <div class="col-6">
         <label class="form-label small fw-semibold mb-1" for="dutyMonthFilter">月份</label>
         <select class="form-select" id="dutyMonthFilter"></select>
        </div>
       </div>
      </div>
      <div class="data-table-container">
       <table class="table table-hover align-middle nowrap w-100" id="dutyTable">
        <thead class="table-light">
         <tr>
          <th class="dtr-control-column" aria-label="展開明細"></th>
          <th>建立時間</th>
          <th>勤務類型</th>
          <th>服勤類型</th>
          <th>簽到日期</th>
          <th>簽到時間</th>
          <th>簽退日期</th>
          <th>簽退時間</th>
          <th>協勤內容</th>
          <th>操作</th>
         </tr>
        </thead>
        <tbody>
        </tbody>
       </table>
      </div>
     </div>
    </section>
   </div>
  </main>
  <div aria-hidden="true" class="modal fade" id="dutyModal" tabindex="-1">
   <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow">
     <div class="modal-header">
      <h2 class="modal-title fs-4 fw-bold" id="modalTitle">
       新增勤務
      </h2>
      <button class="btn-close" data-bs-dismiss="modal">
      </button>
     </div>
     <form class="d-flex flex-column flex-grow-1 overflow-hidden" id="dutyForm">
      <div class="modal-body">
       <input id="originalCreatedAt" type="hidden">
       <input id="nationalId" type="hidden">

       <div class="row g-3" id="dutyFormFields">
        <div class="col-12" id="operationHeadingSection">
         <h3 class="h4 fw-bold mb-0 operation-title">
          <i class="fa-solid fa-right-to-bracket me-2 text-danger" id="operationIcon"></i>
          <span id="operationSectionTitle">勤務簽到</span>
         </h3>
        </div>

        <div class="col-12 duty-form-section" id="locationSection">
         <div class="alert alert-danger d-none mb-3" id="locationAlert" role="alert"></div>
         <div class="location-status-row">
          <div class="d-flex align-items-center gap-2 flex-wrap">
           <span class="fw-semibold">定位狀態：</span>
           <span class="badge text-bg-secondary" id="locationStatusBadge">尚未定位</span>
          </div>
          <button class="btn btn-outline-primary" id="getLocationBtn" type="button">
           <i class="fa-solid fa-location-crosshairs me-1"></i>重新定位
          </button>
         </div>
        </div>

        <div class="col-6 duty-form-section paired-field" id="personTitleSection">
         <label class="form-label fw-semibold" for="personTitle">職稱</label>
         <input class="form-control" id="personTitle" readonly>
        </div>

        <div class="col-6 duty-form-section paired-field" id="personNameSection">
         <label class="form-label fw-semibold" for="personName">姓名</label>
         <select class="form-select" id="personName"></select>
        </div>

        <div class="col-6 duty-form-section paired-field" id="dutyTypeSection">
         <label class="form-label fw-semibold" for="dutyType">勤務類型</label>
         <input class="form-control" id="dutyType" readonly>
        </div>

        <div class="col-6 duty-form-section paired-field" id="serviceTypeSection">
         <label class="form-label fw-semibold" for="serviceType">服勤類型</label>
         <select class="form-select" id="serviceType"></select>
        </div>

        <div class="col-12 duty-form-section" id="checkInSection">
         <div class="row g-3">
          <div class="col-12 col-md-6">
           <label class="form-label fw-semibold" for="checkInDate">簽到日期</label>
           <input class="form-control" id="checkInDate" type="date">
          </div>
          <div class="col-12 col-md-6">
           <label class="form-label fw-semibold" for="checkInTime">簽到時間</label>
           <select class="form-select" id="checkInTime"></select>
          </div>
         </div>
        </div>

        <div class="col-12 duty-form-section" id="checkOutSection">
         <div class="row g-3">
          <div class="col-12 col-md-6">
           <label class="form-label fw-semibold" for="checkOutDate">簽退日期</label>
           <input class="form-control" id="checkOutDate" type="date">
          </div>
          <div class="col-12 col-md-6">
           <label class="form-label fw-semibold" for="checkOutTime">簽退時間</label>
           <select class="form-select" id="checkOutTime"></select>
          </div>
         </div>
        </div>

        <div class="col-12 duty-form-section" id="contentSection">
         <label class="form-label fw-semibold" for="content" id="contentLabel">協勤內容</label>
         <textarea class="form-control" id="content" rows="3"></textarea>
        </div>

        <div class="col-12 duty-form-section" id="signatureSection">
         <label class="form-label fw-semibold">簽名</label>
         <canvas height="180" id="signatureCanvas" width="760"></canvas>
         <button class="btn btn-outline-secondary btn-sm mt-2" id="clearSignatureBtn" type="button">
          <i class="fa-solid fa-eraser me-1"></i>清除簽名
         </button>
        </div>
       </div>
      </div>
      <div class="modal-footer">
       <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">
        取消
       </button>
       <button class="btn btn-danger" id="submitBtn" type="submit">
        <i class="fa-solid fa-right-to-bracket me-1"></i>
        完成簽到
       </button>
      </div>
     </form>
    </div>
   </div>
  </div>
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3 duty-result-toast-container">
   <div aria-atomic="true" aria-live="assertive" class="toast border-0 shadow-lg" id="dutyResultToast" role="alert">
    <div class="toast-header text-white border-0" id="dutyResultToastHeader">
     <i class="fa-solid fa-circle-check me-2" id="dutyResultToastIcon"></i>
     <strong class="me-auto" id="dutyResultToastTitle">操作完成</strong>
     <button aria-label="關閉" class="btn-close btn-close-white" data-bs-dismiss="toast" type="button"></button>
    </div>
    <div class="toast-body fs-6 fw-semibold" id="dutyResultToastMessage"></div>
   </div>
  </div>
  <div id="footerHost">
  </div>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="https://cdn.datatables.net/2.3.8/js/dataTables.min.js">
  </script>
  <script src="https://cdn.datatables.net/2.3.8/js/dataTables.bootstrap5.min.js">
  </script>
  <script src="https://cdn.datatables.net/responsive/3.0.8/js/dataTables.responsive.min.js">
  </script>
  <script src="https://cdn.datatables.net/responsive/3.0.8/js/responsive.bootstrap5.min.js">
  </script>
  <script src="config.js">
  </script>
  <script src="js/common.js">
  </script>
  <script src="js/data-service.js">
  </script>
  <script src="js/duty.js">
  </script>
 </body>
</html>
