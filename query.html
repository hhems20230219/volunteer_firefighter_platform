<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>個人查詢｜義消隊務管理平台</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.3.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/3.0.8/css/responsive.bootstrap5.min.css" rel="stylesheet">
    <link href="css/common.css" rel="stylesheet">
    <link href="css/query.css" rel="stylesheet">
</head>
<body data-page="query">
    <div id="navbarHost"></div>

    <main class="py-4 py-lg-5">
        <div class="container">
            <header class="page-header ps-3 mb-4">
                <h1 class="h2 fw-bold">個人查詢</h1>
                <p class="text-secondary mb-0">
                    查看基本資料、救護證照、訓練、獎項及隊員紀錄。
                </p>
            </header>

            <section class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-6 col-lg-3">
                            <label class="form-label fw-semibold" for="queryPersonTitle">職稱</label>
                            <input class="form-control" id="queryPersonTitle" type="text" readonly>
                        </div>
                        <div class="col-6 col-lg-3">
                            <label class="form-label fw-semibold" for="personSelect">姓名</label>
                            <select class="form-select" id="personSelect"></select>
                        </div>
                        <div class="col-6 col-lg-3">
                            <label class="form-label fw-semibold" for="yearSelect">選擇年度</label>
                            <select class="form-select" id="yearSelect"></select>
                        </div>
                        <div class="col-6 col-lg-3">
                            <label class="form-label fw-semibold" for="monthSelect">選擇月份</label>
                            <select class="form-select" id="monthSelect"></select>
                        </div>
                    </div>
                </div>
            </section>

            <div id="profileContent" hidden>
                <section class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4">
                        <div class="d-flex flex-column flex-lg-row justify-content-between gap-4 mb-4">
                            <div>
                                <h2 class="h3 fw-bold" id="profileName"></h2>
                                <p class="text-secondary mb-0" id="profileOrg"></p>
                            </div>
                        </div>

                        <h3 class="h5 fw-bold mb-3">基本資料</h3>
                        <div class="row g-3" id="basicInfoGrid"></div>
                    </div>
                </section>

                <section class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4">
                        <h2 class="h4 fw-bold mb-3">救護證照</h2>
                        <div class="row g-3" id="certificateCards"></div>
                    </div>
                </section>

                <section class="row g-3 mb-4" id="personalKpis"></section>

                <ul class="nav nav-tabs mb-3" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-target="#trainingPane" data-bs-toggle="tab">
                            訓練
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-target="#awardPane" data-bs-toggle="tab">
                            獎項
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-target="#recordPane" data-bs-toggle="tab">
                            隊員紀錄
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="trainingPane">
                        <section class="card border-0 shadow-sm mb-4">
                            <div class="card-body p-4">
                                <h2 class="h4 fw-bold mb-3">訓練紀錄</h2>
                                <div class="row g-3 mb-4" id="annualTrainingCompliance"></div>
                                <div class="row g-3 mb-4" id="trainingEligibility"></div>

                                <div class="data-table-container">
                                    <table class="table table-hover nowrap w-100" id="trainingTable">
                                        <thead>
                                            <tr>
                                                <th class="dtr-control-column" aria-label="展開明細"></th>
                                                <th>訓練項目</th>
                                                <th>完成日期</th>
                                                <th>備註</th>
                                            </tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                        </section>
                    </div>

                    <div class="tab-pane fade" id="awardPane">
                        <section class="card border-0 shadow-sm mb-4">
                            <div class="card-body p-4">
                                <h2 class="h4 fw-bold mb-3">獎項紀錄與資格判斷</h2>
                                <div class="row g-3 mb-4" id="awardEligibility"></div>

                                <div class="data-table-container">
                                    <table class="table table-hover nowrap w-100" id="awardTable">
                                        <thead>
                                            <tr>
                                                <th class="dtr-control-column" aria-label="展開明細"></th>
                                                <th>獎項</th>
                                                <th>獲獎日期</th>
                                                <th>來源</th>
                                                <th>備註</th>
                                            </tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                        </section>
                    </div>

                    <div class="tab-pane fade" id="recordPane">
                        <section class="card border-0 shadow-sm">
                            <div class="card-body p-4">
                                <h2 class="h4 fw-bold mb-3">隊員紀錄</h2>
                                <div class="timeline" id="memberTimeline"></div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footerHost"></div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.8/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.8/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.8/js/responsive.bootstrap5.min.js"></script>
    <script src="config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/data-service.js"></script>
    <script src="js/query.js"></script>
</body>
</html>
