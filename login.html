<!DOCTYPE html>
<html lang="zh-Hant">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   登入｜義消隊務管理平台
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/css/all.min.css" rel="stylesheet"/>
  <link href="css/common.css" rel="stylesheet"/>
  <link href="css/login.css" rel="stylesheet"/>
 </head>
 <body class="login-page">
  <main class="container py-5">
   <section class="login-card card border-0 shadow-lg mx-auto">
    <div class="card-body p-4 p-lg-5">
     <div class="text-center mb-4">
      <div class="login-icon mx-auto mb-3">
       <i class="fa-solid fa-shield-heart">
       </i>
      </div>
      <h1 class="h3 fw-bold">
       義消隊務管理平台
      </h1>
      <p class="text-secondary mb-0">
       請輸入身分證字號登入
      </p>
     </div>
     <form id="loginForm" novalidate="">
      <label class="form-label fw-semibold" for="nationalId">
       身分證字號
      </label>
      <input autocomplete="username" class="form-control form-control-lg text-uppercase" id="nationalId" maxlength="10" required=""/>
      <div class="form-text">
       系統會依人員主檔判斷登入者與權限。
      </div>
      <div class="alert alert-danger mt-3 d-none" id="loginMessage">
      </div>
      <button class="btn btn-danger btn-lg w-100 mt-4" id="loginBtn" type="submit">
       <i class="fa-solid fa-right-to-bracket me-2">
       </i>
       登入
      </button>
     </form>
     <div class="small text-secondary mt-4">
      範例：E123714468（分隊部）、A223456789（個人）
     </div>
    </div>
   </section>
  </main>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js">
  </script>
  <script src="config.js">
  </script>
  <script src="js/login.js">
  </script>
 </body>
</html>
